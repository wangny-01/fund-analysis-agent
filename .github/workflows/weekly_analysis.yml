name: Weekly Fund Analysis

on:
  schedule:
    # Every Monday at 1:00 AM UTC = 9:00 AM Beijing (UTC+8)
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly analysis
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: python -m src.main --mode weekly

      - name: Commit portfolio state and reports
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update portfolio state and reports [skip ci]"
          file_pattern: "data/ output/"
          commit_user_name: "fund-analysis-bot"
          commit_user_email: "bot@fund-analysis.local"

      - name: Notify on failure
        if: failure()
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          python -c "
          import requests, json, os
          url = os.environ.get('DINGTALK_WEBHOOK_URL', '')
          if url:
              msg = {'msgtype': 'text', 'text': {'content': '⚠️ 周一基金分析任务执行失败，请检查 GitHub Actions 日志'}}
              requests.post(url, json=msg)
          "
